<!doctype html><html><head><meta charset="utf-8"><title>teste</title></head><body style="margin:0;background:#222">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
const r = new THREE.WebGLRenderer(); r.setSize(1000, 500); document.body.appendChild(r.domElement);
const sc = new THREE.Scene(), cam = new THREE.OrthographicCamera(-2, 2, 1, -1, 0.1, 10); cam.position.z = 5;
sc.add(new THREE.AmbientLight(0xffffff, 0.6)); const L = new THREE.DirectionalLight(0xffffff, 2.5); L.position.set(-1, 1, 1); sc.add(L);
const k = new KTX2Loader().detectSupport(r), tl = new THREE.TextureLoader();
const P = (f) => new Promise((res, rej) => f.endsWith('ktx2') ? k.load(f, res, undefined, rej) : tl.load(f, res, undefined, rej));
window.out = {};
try {
  const [cj, nj, ck, nk] = await Promise.all([P('cubos_c.jpg'), P('cubos_n.jpg'), P('cubos_c.ktx2'), P('cubos_n.ktx2')]);
  for (const t of [cj, ck]) t.colorSpace = THREE.SRGBColorSpace;
  const mk = (c, n, x) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(1.9, 1.9), new THREE.MeshStandardMaterial({ map: c, normalMap: n, normalScale: new THREE.Vector2(2, 2) })); m.position.x = x; sc.add(m); };
  mk(cj, nj, -1); mk(ck, nk, 1);
  out.ktx = { fmt: ck.format, mips: ck.mipmaps.length, flipY: ck.flipY, isCompressed: ck.isCompressedTexture };
} catch (e) { out.err = String(e); }
r.render(sc, cam); out.gl = r.getContext().getError(); out.done = true;
</script></body></html>
